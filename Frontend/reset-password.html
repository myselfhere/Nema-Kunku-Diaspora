<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Reset | Nema Kunku Diaspora</title>
  <!-- ✅ Use your public site stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Navbar (public) -->
  <header class="navbar">
    <nav>
      <ul class="nav-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="membership.html">Membership</a></li>
        <li><a href="contact.html">Contact Us</a></li>
        <li><a class="active" href="login.html">Login</a></li>
      </ul>
    </nav>
  </header>

  <main style="min-height: 75vh; display:flex; align-items:center; justify-content:center; padding:24px;">
    <section style="width:100%; max-width:460px;">
      <div style="background:#fff; border-radius:12px; padding:28px; box-shadow:0 6px 16px rgba(0,0,0,.08);">
        <!-- Will swap between “request link” and “set new password” modes -->
        <h2 id="boxTitle" style="color:#1b5e20; margin-bottom:16px;">Reset your password</h2>

        <!-- Request Link Form -->
        <div id="requestPane">
          <p style="margin:0 0 12px; color:#333;">
            Enter your <b>email or member ID</b> and choose how to receive the reset link.
          </p>

          <label style="display:block; font-weight:600; margin:10px 0 6px;">Email or Member ID</label>
          <input id="loginId" type="text" placeholder="e.g., salmemture@gmail.com or NKD001"
                 style="width:100%; padding:12px; border:1px solid #ccc; border-radius:8px;"/>

          <div style="display:flex; gap:10px; align-items:center; margin:14px 0 10px;">
            <label style="display:flex; gap:6px; align-items:center;">
              <input type="radio" name="sendVia" value="email" checked />
              <span>Email</span>
            </label>
            <label style="display:flex; gap:6px; align-items:center;">
              <input type="radio" name="sendVia" value="sms" />
              <span>SMS</span>
            </label>
          </div>

          <div id="phoneRow" style="display:none;">
            <label style="display:block; font-weight:600; margin:6px 0;">Phone (for SMS)</label>
            <input id="phone" type="tel" placeholder="+44 7700 900123"
                   style="width:100%; padding:12px; border:1px solid #ccc; border-radius:8px;"/>
          </div>

          <button id="sendLinkBtn"
                  style="margin-top:14px; width:100%; background:#2e7d32; color:#fff; border:0; border-radius:8px; padding:12px; font-weight:700; cursor:pointer;">
            Send reset link
          </button>

          <div id="requestNote" style="margin-top:12px; font-size:14px; color:#1b5e20;"></div>
        </div>

        <!-- Set New Password Form -->
        <div id="resetPane" style="display:none;">
          <p style="margin:0 0 12px; color:#333;">Enter a new password for your account.</p>

          <label style="display:block; font-weight:600; margin:10px 0 6px;">New Password</label>
          <input id="newPass" type="password" placeholder="New password"
                 style="width:100%; padding:12px; border:1px solid #ccc; border-radius:8px;" />

          <label style="display:block; font-weight:600; margin:10px 0 6px;">Confirm Password</label>
          <input id="confirmPass" type="password" placeholder="Confirm password"
                 style="width:100%; padding:12px; border:1px solid #ccc; border-radius:8px;" />

          <button id="setPassBtn"
                  style="margin-top:14px; width:100%; background:#2e7d32; color:#fff; border:0; border-radius:8px; padding:12px; font-weight:700; cursor:pointer;">
            Update password
          </button>

          <div id="resetNote" style="margin-top:12px; font-size:14px; color:#1b5e20;"></div>
        </div>
      </div>

      <div style="text-align:center; margin-top:12px;">
        <a href="login.html" style="color:#1b5e20; font-weight:700; text-decoration:none;">Back to Login</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2025 Nema Kunku Diaspora. All rights reserved.</p>
  </footer>

  <script type="module" src="js/reset-password.js"></script>
</body>
</html>
