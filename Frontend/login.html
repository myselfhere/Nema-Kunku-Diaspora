<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Nema Kunku Diaspora</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- TOP NAV (same items as site) -->
  <header class="navbar">
    <ul class="nav-menu">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="membership.html">Membership</a></li>
      <li><a href="contact.html">Contact Us</a></li>
      <li><a href="login.html" class="active">Login</a></li>
    </ul>
  </header>

  <!-- LOGIN CARD (centered) -->
  <main class=login-shell">
    <section class="login-card">
      <h1>Member Login</h1>

      <form id=loginForm" class="login-form">
        <label for="identity">Email or Member ID</label>
        <input
          type="text"
          id="identity"
          name="identity"
          placeholder="Enter your email or Member ID"
          required
        />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
        />

        <button type="submit" class="btn-primary">Login</button>

        <p class="logi-help">
          
        </p>

        <p id="loginError" class="error-text" style="display:none;"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    © 2025 <strong>Nema Kunku Diaspora</strong>. All rights reserved.
  </footer>

  <!-- LOGIN LOGIC -->
  <script type="module">
    import { api, setUser, roleHome, offlineRoleFromEmail, go } from "./js/nkd-bus.js";

    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("loginError");
    const identityInput = document.getElementById("identity");
    const passwordInput = document.getElementById("password");

    function showError(msg) {
      if (!errorBox) return;
      errorBox.textContent = msg || "Login failed.";
      errorBox.style.display = "block";
    }

    // Optional: prefill from query string ?identity=...&password=...
    (function prefillFromQuery() {
      try {
        const params = new URLSearchParams(window.location.search);
        const qIdentity = params.get("identity");
        const qPassword = params.get("password");
        if (qIdentity && identityInput) identityInput.value = qIdentity;
        if (qPassword && passwordInput) passwordInput.value = qPassword;
      } catch (_) {}
    })();

    if (form) {
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (errorBox) errorBox.style.display = "none";

        const identity = identityInput.value.trim();
        const password = passwordInput.value;

        if (!identity || !password) {
          return showError("Please enter both identity and password.");
        }

        try {
          // Main online login via backend
          const res = await api.post("/auth/login", { identity, password });
          console.log("[Login] response", res);

          // Accept either { success:true, user } or { ok:true, data }
          let success = false;
          let user = null;

          if (res) {
            if (res.success) {
              success = true;
              user = res.user || res.data || res.member || null;
            } else if (res.ok) {
              success = true;
              user = res.user || res.data || res.member || null;
            }
          }

          if (!success || !user) {
            throw new Error(res?.message || "Invalid credentials");
          }

          setUser(user);

          if (user.mustChangePassword) {
            // adjust this filename if your change-password page is different
            go("member-password.html");
          } else {
            go(roleHome(user.role || "member"));
          }
        } catch (err) {
          console.error("[Login] error", err);

          // Optional offline fallback, still lets admin/roles browse dashboards.
          try {
            const role = offlineRoleFromEmail(identity);
            const fakeUser = {
              name: identity,
              email: identity,
              memberId: identity,
              role,
            };
            setUser(fakeUser);
            go(roleHome(role));
          } catch {
            showError("Login failed. Please check your details or try again later.");
          }
        }
      });
    }
  </script>
</body>
</html>
