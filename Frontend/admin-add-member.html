<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Add Member — Admin</title>
  <link rel="stylesheet" href="admin-style.css"/>
</head>
<body>
  <!-- NAVBAR -->
  <header class="admin-topbar">
    <div class="container row">
      <button class="menu-toggle" aria-label="Menu">☰</button>

      <nav class="admin-nav" id="adminNav">
        <a href="admin-dashboard.html" data-key="dashboard">Dashboard</a>
        <a href="admin-members.html" data-key="members">Members</a>
        <a href="admin-contributions.html" data-key="contributions">Contributions</a>
        <a href="admin-expenditures.html" data-key="expenditures">Expenditures</a>
        <a href="admin-projects.html" data-key="projects">Projects</a>
        <a href="admin-meetings.html" data-key="meetings">Meetings</a>
        <a href="admin-settings.html" data-key="settings">Settings</a>
      </nav>

      <div class="admin-user">
        <span data-user-slot>Admin • admin</span>
        <a href="login.html" id="logoutTop">Logout</a>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="admin-shell">
    <div class="container">
      <h1 class="page-title">Add Member</h1>

      <!-- Top actions -->
      <section class="card" style="margin-bottom:18px">
        <div class="card-body" style="display:flex;gap:10px;flex-wrap:wrap">
          <button id="btnBack" class="btn btn-light">← Back to Members</button>
          <!-- 🔴 THIS id MUST exist for JS -->
          <button id="saveMember" class="btn btn-primary">Save Member</button>
        </div>
      </section>

      <!-- Member info -->
      <section class="card">
        <div class="card-header">Member Information</div>
        <div class="card-body">
          <form id="memberForm">
            <div class="form-group">
              <label for="fullName">Full Name *</label>
              <input id="fullName" placeholder="e.g., Salme Ture" required />
            </div>

            <div class="form-group">
              <label for="email">Email *</label>
              <input id="email" type="email" placeholder="name@example.com" required />
            </div>

            <div class="form-group">
              <label for="phone">Phone</label>
              <input id="phone" placeholder="+44 1234 567 890" />
            </div>

            <div class="form-group">
              <label for="country">Country of Residence</label>
              <input id="country" placeholder="United Kingdom" />
            </div>

            <div class="form-group">
              <label for="position">Position</label>
              <input id="position" placeholder="Member, President, Financial Secretary…" />
            </div>

            <div class="two-col">
              <div class="form-group">
                <label for="plan">Contribution Plan</label>
                <select id="plan">
                  <option value="Annually">Annually</option>
                  <option value="Semi-Annual">Semi-Annual</option>
                </select>
              </div>

              <div class="form-group">
                <label for="memberSince">Member Since</label>
                <input id="memberSince" type="date" />
              </div>
            </div>

            <div class="two-col">
              <div class="form-group">
                <label for="role">Role</label>
                <select id="role">
                  <option value="member">Member</option>
                  <option value="admin">Admin</option>
                  <option value="financial">Financial</option>
                  <option value="project-manager">Project Manager</option>
                  <option value="secretary">Secretary</option>
                  <option value="president">President</option>
                  <option value="viewer">Viewer</option>
                </select>
              </div>

              <div class="form-group">
                <label for="status">Status</label>
                <select id="status">
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="memberId">Member ID *</label>
              <input id="memberId" placeholder="NKD0xx" />
            </div>

            <div class="form-group">
              <label for="contactMethod">Preferred Contact</label>
              <select id="contactMethod">
                <option value="Not set">Not set</option>
                <option value="WhatsApp">WhatsApp</option>
                <option value="Phone">Phone</option>
                <option value="Email">Email</option>
              </select>
            </div>

            <!-- Login details block -->
            <div class="card info-panel" style="margin-top:10px">
              <div class="card-header">Login Details</div>
              <div class="card-body">
                <div class="two-col">
                  <div class="form-group">
                    <label for="username">Username (optional)</label>
                    <input id="username" placeholder="Leave blank = use email" />
                  </div>
                  <div class="form-group">
                    <label for="tempPassword">Temporary Password</label>
                    <input id="tempPassword" placeholder="e.g., NKD001-2025" />
                  </div>
                </div>

                <div class="form-group">
                  <label>
                    <input id="mustChange" type="checkbox" />
                    Member must change password on first login
                  </label>
                </div>

                <div class="row" style="display:flex;gap:8px;flex-wrap:wrap">
                  <button type="button" id="genPass" class="btn btn-light">
                    Generate password from Member ID
                  </button>
                  <button type="button" id="copyLogin" class="btn btn-secondary">
                    Copy login details
                  </button>
                </div>

                <p class="muted" style="margin-top:6px">
                  Default rule: <strong>NKDXXX-2025</strong> (for example NKD003-2025).<br/>
                  Members can login with <strong>email or Member ID</strong>.
                </p>
              </div>
            </div>

            <div class="form-group" style="margin-top:14px">
              <label for="notes">Notes</label>
              <textarea id="notes" rows="3" placeholder="Any additional notes…"></textarea>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <footer class="admin-footer">
    © 2025 <strong>Nema Kunku Diaspora</strong> — All rights reserved.
  </footer>

  <!-- PAGE LOGIC -->
  <script type="module" src="js/admin-add-member.js"></script>
</body>
</html>
