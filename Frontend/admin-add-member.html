<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add Member — Admin</title>
  <link rel="stylesheet" href="admin-style.css" />

  <style>
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media(max-width:900px){ .grid-2{ grid-template-columns:1fr; } }
    .mt-16 { margin-top:16px; }
    textarea { width:100%; resize:vertical; }
  </style>
</head>

<body>
  <!-- TOPBAR -->
  <header class="admin-topbar">
    <div class="container row">
      <button class="menu-toggle" aria-label="Menu">☰</button>

      <nav class="admin-nav" id="adminNav">
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-members.html" class="active">Members</a>
        <a href="admin-contributions.html">Contributions</a>
        <a href="admin-expenditures.html">Expenditures</a>
        <a href="admin-projects.html">Projects</a>
        <a href="admin-meetings.html">Meetings</a>
        <a href="admin-settings.html">Settings</a>
      </nav>

      <div class="admin-user">
        <span data-user-slot>Salme Ture • admin</span>
        <a href="login.html">Logout</a>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="admin-shell">
    <div class="row space-between align-center">
      <h1 class="page-title">Add Member</h1>

      <div class="row gap-8">
        <a href="admin-members.html" class="btn btn-light">← Back to Members</a>

        <!-- IMPORTANT: this id MUST exist -->
        <button id="saveMember" type="button" class="btn btn-primary">
          Save Member
        </button>
      </div>
    </div>

    <!-- Member Information -->
    <section class="card mt-16">
      <div class="card-header">Member Information</div>

      <div class="card-body grid-2">
        <div>
          <label for="fullName">Full Name *</label>
          <input id="fullName" placeholder="e.g., Salme Ture" />
        </div>

        <div>
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="name@example.com" />
        </div>

        <div>
          <label for="phone">Phone</label>
          <input id="phone" placeholder="+44..." />
        </div>

        <div>
          <label for="country">Country</label>
          <input id="country" placeholder="United Kingdom" />
        </div>

        <div>
          <label for="position">Position (optional)</label>
          <input id="position" placeholder="Member / Officer title" />
        </div>

        <div>
          <label for="contactMethod">Preferred Contact</label>
          <select id="contactMethod">
            <option>Not set</option>
            <option>Phone</option>
            <option>WhatsApp</option>
            <option>Email</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Membership & Plan -->
    <section class="card mt-16">
      <div class="card-header">Membership & Plan</div>

      <div class="card-body grid-2">
        <div>
          <label for="memberId">Member ID *</label>
          <input id="memberId" placeholder="NKD001" />
        </div>

        <div>
          <label for="status">Status</label>
          <select id="status">
            <option>Active</option>
            <option>Pending</option>
            <option>Inactive</option>
          </select>
        </div>

        <div>
          <label for="plan">Plan</label>
          <select id="plan">
            <option>Annually</option>
            <option>Semi-Annual</option>
          </select>
        </div>

        <div>
          <label for="joined">Joined</label>
          <input id="joined" type="date" />
        </div>
      </div>
    </section>

    <!-- Account Access (Login) -->
    <section class="card mt-16">
      <div class="card-header">Account Access (Login)</div>

      <div class="card-body grid-2">
        <div>
          <label for="role">Role</label>
          <select id="role">
            <option value="member">Member</option>
            <option value="admin">Admin</option>
            <option value="financial">Financial</option>
            <option value="project-manager">Project Manager</option>
            <option value="secretary">Secretary</option>
            <option value="viewer">Viewer</option>
          </select>
        </div>

        <div>
          <label for="username">Username</label>
          <input id="username" placeholder="email or member ID" />
        </div>

        <div>
          <label for="tempPassword">Temporary Password</label>
          <div style="display:flex;gap:8px;">
            <input id="tempPassword" placeholder="auto-generate" />
            <!-- IMPORTANT: id genPass -->
            <button id="genPass" type="button" class="btn btn-light">
              Generate
            </button>
          </div>
        </div>

        <div style="align-self:end;">
          <label style="display:flex;align-items:center;gap:8px;">
            <input id="mustChange" type="checkbox" checked />
            Must change password on first login
          </label>
        </div>
      </div>

      <div class="card-footer">
        <!-- IMPORTANT: id copyLogin -->
        <button id="copyLogin" type="button" class="btn btn-secondary">
          Copy Login Details
        </button>
      </div>
    </section>

    <!-- Notes -->
    <section class="card mt-16">
      <div class="card-header">Notes</div>
      <div class="card-body">
        <textarea id="notes" rows="4"></textarea>
      </div>
    </section>
  </main>

  <footer class="admin-footer">
    © 2025 Nema Kunku Diaspora — All rights reserved.
  </footer>

  <!-- Controller -->
  <script type="module" src="./js/admin-add-member.js"></script>
</body>
</html>
