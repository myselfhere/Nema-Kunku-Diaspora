<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Change Password | Nema Kunku Diaspora</title>
  <link rel="stylesheet" href="admin-style.css"/>
  <style>
    .hint { font-size: 12px; color: #5b6; margin-top: 6px; }
    .err  { color: #b33; }
    .ok   { color: #205a2f; }
    .meter { height: 6px; background:#e8f3ea; border-radius:999px; margin-top:8px; overflow:hidden }
    .meter > b { display:block; height:100%; width:0; background:#a3d9a5; transition:width .25s ease }
  </style>
</head>
<body>
<header class="admin-topbar">
  <div class="container row">
    <nav class="admin-nav">
      <a id="lnkDash" href="#">Dashboard</a>
      <a id="lnkProfile" href="#">Profile</a>
      <a id="lnkAttendance" href="#">Attendance</a>
      <a id="lnkContrib" href="#">Contributions</a>
      <a class="active" href="#">Password</a>
    </nav>
    <div class="admin-user"><a href="login.html">Logout</a></div>
  </div>
</header>

<main class="admin-shell container">
  <h1 class="page-title">Change Password</h1>

  <section class="card">
    <div class="card-header">Update your password</div>
    <div class="card-body">
      <form id="pwdForm" class="form-grid">
        <div class="form-field">
          <label for="currentPwd">Current Password</label>
          <input id="currentPwd" name="current" type="password" autocomplete="current-password" required />
        </div>

        <div class="form-field">
          <label for="newPwd">New Password</label>
          <input id="newPwd" name="next" type="password" autocomplete="new-password" required minlength="8"/>
          <div class="meter"><b id="meterBar"></b></div>
          <div class="hint" id="strengthHint">Use 8+ chars, mix letters & numbers.</div>
        </div>

        <div class="form-field">
          <label for="confirmPwd">Confirm New Password</label>
          <input id="confirmPwd" name="confirm" type="password" autocomplete="new-password" required />
          <div class="hint" id="matchHint"></div>
        </div>

        <div class="actions" style="margin-top:8px">
          <button class="btn btn-primary" type="submit" id="btnSave">Change Password</button>
          <button class="btn btn-secondary" type="button" id="btnCancel">Back</button>
        </div>
      </form>

      <p id="msg" class="hint" style="display:none"></p>
    </div>
  </section>
</main>

<footer class="admin-footer">© 2025 Nema Kunku Diaspora</footer>

<script type="module">
  import { getParam } from "./js/member-common.js";
  import { post, put } from "./js/nkd-bus.js";

  const memberId = getParam("memberId") || "";
  // wire nav links
  document.getElementById("lnkDash").href       = `member-dashboard.html?memberId=${encodeURIComponent(memberId)}`;
  document.getElementById("lnkProfile").href    = `member-profile.html?memberId=${encodeURIComponent(memberId)}`;
  document.getElementById("lnkAttendance").href = `member-attendance.html?memberId=${encodeURIComponent(memberId)}`;
  document.getElementById("lnkContrib").href    = `member-contributions.html?memberId=${encodeURIComponent(memberId)}`;

  const form   = document.getElementById("pwdForm");
  const current= document.getElementById("currentPwd");
  const next   = document.getElementById("newPwd");
  const confirm= document.getElementById("confirmPwd");
  const bar    = document.getElementById("meterBar");
  const sHint  = document.getElementById("strengthHint");
  const mHint  = document.getElementById("matchHint");
  const msg    = document.getElementById("msg");
  const btnSave= document.getElementById("btnSave");
  const btnCancel=document.getElementById("btnCancel");

  function score(pwd){
    let s = 0;
    if (!pwd) return 0;
    if (pwd.length >= 8) s += 25;
    if (/[A-Z]/.test(pwd)) s += 20;
    if (/[a-z]/.test(pwd)) s += 20;
    if (/\d/.test(pwd))    s += 20;
    if (/[^A-Za-z0-9]/.test(pwd)) s += 15;
    return Math.min(100, s);
  }

  function updateMeter(){
    const n = next.value || "";
    const sc = score(n);
    bar.style.width = sc + "%";
    sHint.textContent =
      sc < 40 ? "Weak — add numbers & symbols." :
      sc < 70 ? "Okay — add more variety." :
      "Strong password.";
  }

  function checkMatch(){
    if (!confirm.value) { mHint.textContent = ""; return true; }
    const ok = next.value === confirm.value;
    mHint.textContent = ok ? "✓ Matches" : "✗ Passwords do not match";
    mHint.className = "hint " + (ok ? "ok" : "err");
    return ok;
  }

  next.addEventListener("input", () => { updateMeter(); checkMatch(); });
  confirm.addEventListener("input", checkMatch);

  btnCancel.addEventListener("click", () => {
    window.location.href = `member-dashboard.html?memberId=${encodeURIComponent(memberId)}`;
  });

  async function tryEndpoints(payload){
    // 1) Preferred: member-owned endpoint
    try {
      return await put(`/members/${encodeURIComponent(memberId)}/password`, payload);
    } catch(e1) {
      // 2) Auth service: change-password
      try {
        return await post(`/auth/change-password`, { memberId, ...payload });
      } catch(e2) {
        // 3) Legacy auth route
        return await post(`/auth/password`, { memberId, ...payload });
      }
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.style.display = "none";

    if (!checkMatch()) {
      msg.textContent = "Please make sure the new passwords match.";
      msg.className = "hint err";
      msg.style.display = "block";
      return;
    }
    if (score(next.value) < 40) {
      msg.textContent = "Password is too weak. Use at least 8 chars with letters & numbers.";
      msg.className = "hint err";
      msg.style.display = "block";
      return;
    }

    btnSave.disabled = true;

    try {
      await tryEndpoints({ currentPassword: current.value, newPassword: next.value });
      msg.textContent = "Password updated successfully.";
      msg.className = "hint ok";
      msg.style.display = "block";
      form.reset();
      updateMeter();
      setTimeout(() => {
        window.location.href = `member-dashboard.html?memberId=${encodeURIComponent(memberId)}`;
      }, 900);
    } catch (err) {
      msg.textContent = (err && err.message) ? `Failed: ${err.message}` : "Failed to change password.";
      msg.className = "hint err";
      msg.style.display = "block";
    } finally {
      btnSave.disabled = false;
    }
  });

  // init meter on first paint
  updateMeter();
</script>
</body>
</html>
