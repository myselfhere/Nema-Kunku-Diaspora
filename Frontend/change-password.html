<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Change Password | Nema Kunku Diaspora</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <nav class="navbar">
    <ul class="nav-menu">
      <li><a href="index.html">Home</a></li>
      <li><a class="active" href="change-password.html">Change Password</a></li>
    </ul>
  </nav>

  <main class="main-content" style="display:flex;align-items:center;justify-content:center;min-height:60vh;">
    <div class="card" style="background:#fff;max-width:420px;width:92%;padding:28px;border-radius:12px;box-shadow:0 10px 22px rgba(0,0,0,.06);text-align:center">
      <h2>Set a New Password</h2>
      <p>Enter your new password to continue.</p>

      <form id="cpForm">
        <input id="pw1" type="password" placeholder="New password" required style="width:100%;padding:12px 14px;border:1px solid #dcdcdc;border-radius:8px;font-size:16px"/>
        <input id="pw2" type="password" placeholder="Confirm new password" required style="width:100%;padding:12px 14px;border:1px solid #dcdcdc;border-radius:8px;font-size:16px;margin-top:10px"/>
        <button type="submit" class="btn" style="width:100%;margin-top:12px">Save Password</button>
        <div id="msg" style="margin-top:10px"></div>
      </form>
    </div>
  </main>

  <footer class="footer"><p>© 2025 Nema Kunku Diaspora. All rights reserved.</p></footer>

  <!-- Correct paths: both are inside Frontend/js/ -->
  <script src="js/auth.js"></script>
  <script src="js/change-password.js"></script>
</body>
</html>
