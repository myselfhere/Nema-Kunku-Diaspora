<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set New Password | Nema Kunku Diaspora</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Public navbar (same as site) -->
  <header class="site-topbar">
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="projects.html">Projects</a>
      <a href="membership.html">Membership</a>
      <a href="contact.html">Contact Us</a>
      <a class="login-badge" href="login.html">Login</a>
    </nav>
  </header>

  <main class="auth-shell">
    <section class="auth-card">
      <h1>Set a new password</h1>
      <p id="who" class="muted"></p>

      <div class="input">
        <label>New Password</label>
        <input id="p1" type="password" placeholder="Enter new password" />
      </div>
      <div class="input">
        <label>Confirm Password</label>
        <input id="p2" type="password" placeholder="Re-enter new password" />
      </div>

      <button id="saveBtn" class="btn btn--primary" disabled>Save New Password</button>
      <p id="msg" class="muted mt-16"></p>

      <div class="mt-16">
        <a href="login.html">Back to Login</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">© 2025 Nema Kunku Diaspora. All rights reserved.</footer>

  <script type="module" src="js/set-new-password.js"></script>
</body>
</html>
